name: Bug report
description: Report a reproducible ChoiceTrain problem using synthetic or non-sensitive data.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: Do not include pupil names, photographs, session exports, EEG data, or other sensitive school information.
  - type: input
    id: version
    attributes:
      label: ChoiceTrain version
      placeholder: V1.6.0
    validations:
      required: true
  - type: dropdown
    id: device
    attributes:
      label: Device or browser group
      options:
        - Windows desktop or touchscreen
        - iPad or Safari
        - Android or Chrome
        - Kindle Silk
        - Other
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      description: Use synthetic labels and images only.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behaviour
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy confirmation
      options:
        - label: I have removed all pupil and school-sensitive information.
          required: true
