name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test release tooling
        run: npm run test:release

      - name: Test fail-closed promotion guard
        run: npm run test:promotion

      - name: Validate research data contracts
        run: npm run test:schema

      - name: Validate V1.8 implementation coverage
        run: npm run test:coverage

      - name: Test V1.8 review-pack tooling
        run: npm run test:review-pack

      - name: Check V1.8 candidate readiness
        run: npm run check:candidate:v180

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium webkit

      - name: Run browser tests
        run: npm run test:browser

      - name: Run mobile and WebKit compatibility smoke tests
        run: npm run test:browser:compat

      - name: Upload failed test evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-failure-evidence
          path: test-results/
          if-no-files-found: ignore

  deploy:
    needs: test
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
